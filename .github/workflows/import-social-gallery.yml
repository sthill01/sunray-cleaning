name: Import Instagram and Facebook Gallery Photos

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Photo source to import"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - instagram
          - facebook
      limit:
        description: "Maximum photos to request from each source"
        required: true
        default: "24"
      approve:
        description: "Publish newly imported photos immediately"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  import-social-gallery:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Import Instagram and Facebook photos
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION || 'v24.0' }}
          SOCIAL_GALLERY_DEFAULT_CITY: ${{ vars.SOCIAL_GALLERY_DEFAULT_CITY || 'Park City' }}
          SOCIAL_GALLERY_DEFAULT_COUNTY: ${{ vars.SOCIAL_GALLERY_DEFAULT_COUNTY || 'Summit County' }}
          SOCIAL_GALLERY_DEFAULT_REGION: ${{ vars.SOCIAL_GALLERY_DEFAULT_REGION || 'Utah' }}
          SOCIAL_GALLERY_SOURCE: ${{ inputs.source }}
          SOCIAL_GALLERY_LIMIT: ${{ inputs.limit }}
          SOCIAL_GALLERY_APPROVED: ${{ inputs.approve && '1' || '0' }}
        run: node scripts/import-meta-gallery.mjs

      - name: Build Cloudflare preview
        run: python tools/build-cloudflare-preview.py

      - name: Commit social gallery updates
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update Instagram and Facebook gallery photos"
          file_pattern: data/social-gallery.json assets/social
